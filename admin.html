<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Panel</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, select, button { margin: 10px 0; padding: 10px; display: block; width: 320px; }
    #admin-section { display: none; }
    #downtime-box { display: none; background: #ffeeee; padding: 10px; border-radius: 5px; width: 320px; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-section">
    <h2>Admin Login</h2>
    <input type="password" id="password-input" placeholder="Enter password" />
    <button id="login-btn">Access Controls</button>
  </div>

  <!-- Hidden Admin Controls -->
  <div id="admin-section">
    <h2>Admin Control Panel</h2>
    
    <label>Detailed Status (Controls Colors/Lockdown):</label>
    <select id="state-input">
      <option value="Operational">Operational (Green)</option>
      <option value="Issues">Minor Issues (Yellow)</option>
      <option value="Down">System Down (Red - Lockdown)</option>
    </select>

    <label>Detailed Message (Prewritten Status):</label>
    <select id="message-input">
      <option value="idle">idle</option>
      <option value="loading">loading</option>
      <option value="logging in">logging in</option>
      <option value="waiting for reply">waiting for reply</option>
      <option value="unexpected delay">unexpected delay</option>
      <option value="working on it">working on it</option>
      <option value="the server is busy at the moment. Please wait">the server is busy at the moment. Please wait</option>
      <option value="on hold">on hold</option>
    </select>

    <!-- Appears only when Down is selected -->
    <div id="downtime-box">
      <label>Estimated Downtime (Minutes):</label>
      <input type="number" id="minutes-input" value="15" min="1" />
    </div>

    <button id="update-btn">Update Website</button>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
