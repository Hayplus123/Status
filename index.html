<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; transition: background 0.3s; }
    .status-box { padding: 30px; border-radius: 12px; display: inline-block; border: 3px solid #ccc; max-width: 500px; }
  </style>
</head>
<body>
  
  <div class="status-box" id="status-container">
    <h1 id="status-text">Loading...</h1>
    <p id="status-message">Fetching latest updates from server.</p>
    <div id="timer-display" style="font-weight: bold; margin-top: 15px; font-size: 1.2em;"></div>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
